name: shahid_finance
description: "Shahid Finance — personal finance tracker: income, expenses, wallets, budgets and reports in PKR. Offline-first with optional cloud backup."
publish_to: 'none'

version: 1.1.5+7

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  google_fonts: ^6.3.2
  local_auth: ^3.0.0
  fl_chart: ^0.69.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/profile_photo.jpg
    - assets/images/wallets/easypaisa.png
    - assets/images/wallets/jazzcash.png
    - assets/images/wallets/meezan.png
  # Plus Jakarta Sans is bundled as an asset (offline reliability, master
  # spec §2.3). google_fonts resolves these exact weights from the bundle;
  # runtime fetching is disabled in main.dart.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
