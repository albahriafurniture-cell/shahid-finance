name: Smoke test (build + emulator boot)

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHAHID_FINANCE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHAHID_FINANCE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/shahid-finance-release.keystore
            cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=shahidfinance
          storeFile=shahid-finance-release.keystore
          EOF
          fi

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install, launch, capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.shahid.finance/.MainActivity
            sleep 12
            adb shell pidof com.shahid.finance > pid.txt || true
            adb shell screencap -p /sdcard/boot.png
            adb pull /sdcard/boot.png boot.png
            adb logcat -d > logcat.txt
            grep -iE "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com.shahid.finance" logcat.txt > crash.txt || true
            echo "--- pid ---"; cat pid.txt
            echo "--- crash lines ---"; cat crash.txt
            test -s pid.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shahid-finance-boot-test
          path: |
            boot.png
            logcat.txt
            crash.txt
            pid.txt
          retention-days: 14
