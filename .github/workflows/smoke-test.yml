name: Smoke test (build + emulator boot)

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SHAHID_FINANCE_KEYSTORE_PASSWORD }}
        run: |
          # FAIL FAST (v1.1.1): never silently fall back to debug signing.
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::SHAHID_FINANCE_KEYSTORE_PASSWORD secret is missing or empty."
            exit 1
          fi
          if ! openssl enc -d -aes-256-cbc -salt -pbkdf2 -in android/app/shahid-finance-release.keystore.enc -out android/app/shahid-finance-release.keystore -pass env:KEYSTORE_PASSWORD; then
            echo "::error::Release keystore decrypt failed - check SHAHID_FINANCE_KEYSTORE_PASSWORD."
            exit 1
          fi
          # PATH FIX (v1.1.1 - the actual v1.1.0 bug): Gradle reads
          # rootProject.file("key.properties"), and for a Flutter Android
          # project rootProject is android/ - NOT the repo root. The old
          # workflow wrote key.properties to the repo root, so Gradle
          # never saw it and silently fell back to debug signing.
          # storeFile resolves relative to android/app/, so unchanged.
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=shahidfinance
          storeFile=shahid-finance-release.keystore
          EOF
          if [ ! -s android/key.properties ] || [ ! -s android/app/shahid-finance-release.keystore ]; then
            echo "::error::Release keystore or android/key.properties missing after restore."
            exit 1
          fi
          echo "Release signing configured (android/key.properties)."

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify release certificate SHA-1
        run: |
          # Same belt-and-braces check as build-apk.yml: refuse to boot
          # an APK that is not signed with the Firebase-registered
          # release keystore (Google sign-in error 10 otherwise).
          APK="build/app/outputs/flutter-apk/app-release.apk"
          EXPECTED="9B:5D:84:36:B2:5E:22:5A:3C:21:BE:05:C5:DF:DA:10:AA:9B:28:2E"
          SHA1=""
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            SHA1="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -oiP 'SHA-1 digest:\s*\K[0-9A-Fa-f:]+' | head -n 1)"
          fi
          if [ -z "$SHA1" ]; then
            SHA1="$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -oiP 'SHA1:\s*\K[0-9A-Fa-f:]+' | head -n 1)"
          fi
          echo "APK signing certificate SHA-1: ${SHA1:-unknown}"
          if [ "$SHA1" != "$EXPECTED" ]; then
            echo "::error::APK is NOT signed with the registered release keystore (expected SHA-1 $EXPECTED, got ${SHA1:-unknown})."
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install, launch, capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.shahid.finance/.MainActivity
            sleep 12
            adb shell pidof com.shahid.finance > pid.txt || true
            adb shell screencap -p /sdcard/boot.png
            adb pull /sdcard/boot.png boot.png
            adb logcat -d > logcat.txt
            grep -iE "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com.shahid.finance" logcat.txt > crash.txt || true
            echo "--- pid ---"; cat pid.txt
            echo "--- crash lines ---"; cat crash.txt
            test -s pid.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shahid-finance-boot-test
          path: |
            boot.png
            logcat.txt
            crash.txt
            pid.txt
          retention-days: 14
